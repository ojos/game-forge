name: deploy-compiler

# 隔離ビルドコンテナ（7.1 / M2-4）のイメージを更新する。
#
# ─────────────────────────────────────────────────────────────────────────────
# **このファイルは仕様より古い。確定24（#76）でビルド実行環境は AWS Lambda に
# 決まったが、下の deploy ジョブは VPS への SSH のままである。**
#
# #76 の scope.out が「実際の構築」を外しているため、決定と仕様の整合だけが先に
# 入り、実装がまだ追いついていない。**差し替えは #19（M2-5）が持つ。**
#
# 9.3 は現在「ECR へ push し update-function-code で入れ替える」と定めている。
# build-and-push（1 段目）は push 先が ghcr.io → ECR に変わるだけで骨格は残るが、
# **deploy（2 段目）は丸ごと置き換わる。**
#
# ここに注記を置くのは、ファイルの中身が仕様と食い違ったまま黙って残ることを
# 避けるためである。**deploy ジョブは VPS の secret が揃わない限り skip する**ので、
# 現に一度も走っていない（下記）。動いていないものが古いこと自体は害が無いが、
# 読んだ人が「9.3 と違う」と迷う経路は塞いでおく。
# ─────────────────────────────────────────────────────────────────────────────
#
# 以下は起票時（VPS 前提）の設計記録である。**現在の方針ではない。**
#
# 9.3 は「GitHub Actions (deploy-compiler.yml) 経由で SSH 接続し、Docker イメージを
# さくらのVPS へ自動更新・コンテナ再起動」と定める。ここは 2 段に分ける。
#
#   1. build-and-push: イメージを組み立てて GitHub Container Registry へ push する。
#   2. deploy:         VPS へ SSH し、pull して入れ替える。
#
# **なぜ分けるか。** VPS はまだ存在しない（M2-5 の前提）。1 段目だけなら今日から
# 動かせて、「main への push でイメージが更新される」という受け入れ条件を実際に
# 検証できる。1 段で SSH まで書くと、VPS が来るまで**一度も走らないワークフロー**に
# なり、動くかどうか分からないものを緑として扱うことになる。
#
# 2 段目は必要な secret が揃っていないあいだ skip する。**失敗ではなく skip に
# するのは、未設定と故障を区別するためである。** 落とすと「VPS がまだ無い」ことが
# 毎回の赤として現れ、本物の故障が埋もれる。
#
# レジストリ経由にすることで、CI から VPS へ push するのではなく VPS が pull する
# 形にもできる。その場合 2 段目は不要になるが、9.3 の記述に合わせて置いてある。

on:
  push:
    branches: [main]
    paths:
      - 'docker/isolated-build/**'
      - '.github/workflows/deploy-compiler.yml'
  # 手で回せるようにする。VPS を用意した直後など、docker/ を変えずに配りたいことがある。
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-compiler
  # 途中で止めない。イメージの push とデプロイは中断されると中途半端な状態を残す。
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: イメージ名を決める
        id: meta
        # レジストリのパスは小文字でなければならない。リポジトリ名に大文字が
        # 含まれていても通るよう、ここで落としておく。
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/isolated-build"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ビルドする
        # commit SHA でも tag を打つ。`latest` だけだと、VPS 上のどの版が動いて
        # いるのかを後から特定できない。
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:${GITHUB_SHA}" \
            docker/isolated-build

      - name: 封じ込めの検査を通す
        # **push の前に検査する。** 7.1 の制約下で実際にビルドが通らないイメージを
        # レジストリへ置かない。
        #
        # IMAGE を渡すのは、検査スクリプトに作り直させないためである。既定では
        # スクリプトが自分でビルドするが、それだと「同じ Dockerfile から作った別の
        # イメージ」を検査することになり、配る現物が検査を通った保証にならない。
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        run: bash scripts/check-isolated-build.sh

      - name: push する
        run: |
          docker push "${{ steps.meta.outputs.image }}:latest"
          docker push "${{ steps.meta.outputs.image }}:${GITHUB_SHA}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: secret が揃っているか
        id: guard
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        # **4 つすべてを見る。** ホスト鍵を落とすと、3 つ揃った時点で deploy が走り、
        # 空の known_hosts でホスト鍵の検証に失敗する。「未設定なので skip」と
        # 「設定したのに壊れている」を区別できなくなる。
        run: |
          if [[ -z "${VPS_HOST}" || -z "${VPS_USER}" || -z "${VPS_SSH_KEY}" || -z "${VPS_HOST_KEY}" ]]; then
            echo "[deploy] VPS の secret が未設定のため skip します（VPS は M2-5 の前提）。"
            echo "[deploy] 必要なのは VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_HOST_KEY の 4 つです。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH でイメージを入れ替える
        if: steps.guard.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # ホスト鍵は事前に登録したものだけを信用する。StrictHostKeyChecking=no は
          # 中間者を黙って受け入れるので使わない。未設定なら上の guard で skip 済み。
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "docker pull '${IMAGE}:${GITHUB_SHA}' && docker tag '${IMAGE}:${GITHUB_SHA}' game-forge/isolated-build:local"
