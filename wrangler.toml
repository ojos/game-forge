# Cloudflare Pages の構成宣言。
#
# **Workers ではなく Pages である**（確定22 / #71）。ゾーンは確定17 で Route53 へ
# 委譲済みで Cloudflare 上に無く、Workers のカスタムドメインはゾーンが Cloudflare に
# あることを要求するため `game-forge.ojos.jp` に張れない。Pages のカスタムドメインは
# サブドメインなら外部 DNS のまま CNAME 1 本で足りる（docs/pages-deploy.md）。
#
# 本番向けの設定（custom domain / 本物の D1 database_id）は、対応する issue が来た
# 時点で足す。実在しない ID を先に書くと、宣言が外部状態を指しているように読める。
name = "game-forge"
# Pages の出力ディレクトリ。**静的ファイルを置かない。**
#
# Pages は静的ファイルを Functions より先に解決するため、ここに index.html を置くと
# functions/[[path]].ts の `/` が隠れる（実測で確認）。画面はすべて Worker が生成する
# ので、このディレクトリは空のまま（.gitkeep だけ）にしておく。
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"
# MCP の認可（#696 / 仕様 5.15）で足した互換フラグ。
#
# **`global_fetch_strictly_public`** は、CIMD（クライアントの id が URL で、その文書をこちらが取りに行く）の
# SSRF 対策である。`@cloudflare/workers-oauth-provider` は、このフラグが無いと CIMD を宣言せず
# （メタデータの `client_id_metadata_document_supported` が false）、URL の id を受けると例外を投げる
# ——**部品の側で取得先を絞る設定は無い**（0.10.3 の実装で確かめた）。
#
# **アプリ全体の `fetch()` に効く。** 変わるのは「自分のゾーンへの `fetch()` を、オリジンへ直行させずに
# Cloudflare の表玄関から入れ直す」ことだけである（公式の互換フラグの説明）。このサイトはゾーンを
# Cloudflare に持たず（確定17 / 確定22。DNS は Route53）、外へ出る `fetch()` は AWS（Lambda・Bedrock）・
# Resend・Google の公開の口だけで、自分のホストを `fetch()` で呼ぶ経路は無い（#696 PR① で `src/` を洗った）。
# **`nodejs_compat` は足さない**（部品は Node の API を使わない）。
compatibility_flags = ["global_fetch_strictly_public"]

# 開発用ホスト名。src/index.ts は Host ヘッダでアプリ側とサンドボックス側を出し分ける。
#
# `*.localtest.me` は公開 DNS が 127.0.0.1 を返すワイルドカードで、hosts ファイルの
# 編集を要しない。`localtest.me` は PSL の public suffix ではないため登録可能ドメイン
# （eTLD+1）は `localtest.me` であり、下の 2 つは **別オリジン・同一サイト**になる。
# これは本番（`app.game-forge.ojos.jp` と `sandbox.game-forge.ojos.jp` が eTLD+1
# `ojos.jp` の下で同一サイト）と同じ関係で、7.2 の検証に必要な構造を再現する。
# **再現しているのは「別オリジン・同一サイト」であって、ホスト名の親子関係ではない。**
# ローカルの `sandbox.` はアプリ用ホスト `game-forge.localtest.me` の**子**だが、本番では
# `app.` と `sandbox.` が `game-forge.ojos.jp` の下で**兄弟**である（本番のアプリ用ホストに
# `app.` が付くのは #89 の DNS の制約。`[env.production.vars]` の注記）。
# （#570 注記 2026-09-15: この段落の本番のアプリ用ホストは `game-forge.ojos.jp` と書いていた。
# #89 より前の値である。）
[vars]
APP_HOST = "game-forge.localtest.me"
SANDBOX_HOST = "sandbox.game-forge.localtest.me"
# 運営の管理画面のホスト（2.4.1 / #356）。**3 つ目のホストである。**
#
# **セッションを app と共有できないので、別のホストであることに意味がある。** cookie は
# `__Host-` 接頭辞で `Domain` 属性を持てず（7.2 必須要件 2 / `src/session.ts`）、
# **admin 側は独立にログインする**（`docs/admin-host.md`）。
#
# **ローカルでも `.localtest.me` の下に置く。** `*.localtest.me` は公開 DNS が 127.0.0.1 を
# 返すので、hosts ファイルを触らずに 3 ホストが立つ。**ローカルの admin はアプリ用ホスト
# `game-forge.localtest.me` の子である**（本番では `admin.` と `app.` が `game-forge.ojos.jp` の
# 下で兄弟）。親子と兄弟の違いはあるが、**別オリジン・同一サイトという関係は本番と同じ**で、
# `__Host-` の cookie はホスト名ちょうどにしか付かないので、子のホストへ漏れることもない
# ——**同一サイトなので、`__Host-` が要る理由はここでも変わらない。**
# （#570 注記 2026-09-15: この段落は「app と兄弟の関係にしてあるのは、本番（`admin.` と `app.` が
# `game-forge.ojos.jp` の下で兄弟）と同じ構造を再現するためである」と書いていたが、値は子である。）
ADMIN_HOST = "admin.game-forge.localtest.me"
# どの生成モデルで生成するか（確定5 / 4.1 / #83）。
#
# **シークレットではないので `[vars]` に置く。** モデルの選択は秘密ではなく構成で、
# `.dev.vars` へ置くと本番でどのモデルを使っているかが宣言から読めなくなる。
#
# 値は `src/generation-models.ts` の登録簿の鍵（`sonnet-4-6` / `deepseek-v3-2`）。
# **未知の綴りは既定へ落とさず例外にする**（A/B の片側が黙ってもう片側になると、
# 4.2 の比較が成立しない）。省略すると既定（`sonnet-4-6`）になるが、**全環境で明示する。**
# 暗黙に既定へ寄るのと、そのモデルを選んだのとは、次に触る人にとって別物である。
GENERATION_MODEL = "sonnet-4-6"
# ビルド関数（AWS Lambda）の関数名（確定24 / 3.3-5 / #19）。
#
# **シークレットではないので `[vars]` に置く。** 呼ぶ相手が誰かは秘密ではなく構成で、
# `.dev.vars` へ置くと本番がどの関数を叩いているかが宣言から読めなくなる
# （`GENERATION_MODEL` と同じ扱い）。
#
# 値の正本は `terraform/build-function.tf` の `local.build_function_name` である。
# ここはその写しなので、宣言を変えたら追随させること（`docs/build-invocation.md`）。
#
# **#160 以降、エッジ（ローカルを含む）はビルド関数を呼ばない。** 呼ぶのはオーケストレータで、
# 宛先はオーケストレータの環境変数 `BUILD_FUNCTION_NAME`（`terraform/orchestrator.tf` が宣言から
# 入れる）である。**ここにある値をエッジの本番経路は読まない**——読むのは同期実装
# （`src/generate.ts` の `runJobInline` から呼ばれる `createLambdaBuild`）だけで、`runJobInline` は
# どの環境にも結線されていない。エッジの鍵（`BUILD_AWS_*`）にもビルド関数を呼ぶ許可は無い
# （`docs/build-invocation.md` 2・3 章）。値を残すかどうかは #570 では変えていない。
#
# **ローカルにも同じ値を置く**（9.2 のとおり Dev アカウントに Lambda は無く、別名の開発用関数が存在しない）。
# （#570 注記 2026-09-15: この段落は「ローカルでこの経路が動くかどうかは、`.dev.vars` に本番アカウントの
# 資格情報を入れたかどうかで決まる（入れなければ設定不足として呼び出しの手前で落ちる。確定20 が受け入れた
# 『本番構成をローカルで検証できない』）」と書き、資格情報を「`.dev.vars` にある（`BUILD_AWS_*`）」としていた。
# エッジがビルド関数を直接呼んでいた #160 より前の書き方である。）
BUILD_FUNCTION_NAME = "game-forge-build"
# オーケストレータ（AWS Lambda）の関数名（3.3-2.6 / #160）。
#
# **シークレットではないので `[vars]` に置く**（`BUILD_FUNCTION_NAME` と同じ扱い）。
# 資格情報のほうは `.dev.vars` にある（`BUILD_AWS_*`。ビルド関数を呼ぶのに使っていた
# 鍵が、そのままオーケストレータを呼ぶのに移った。`src/orchestrator/start-job.ts`）。
#
# 値の正本は `terraform/orchestrator.tf` の `local.orchestrator_function_name` である。
# ここはその写しなので、宣言を変えたら追随させること（`docs/orchestrator.md`）。
#
# **ローカルでも同じ値を置く。** Dev アカウントに Lambda は無いので、ローカルで
# この経路が動くかどうかは `.dev.vars` に本番アカウントの資格情報を入れたかどうかで
# 決まる（`BUILD_FUNCTION_NAME` と同じ事情。確定20）。
ORCHESTRATOR_FUNCTION_NAME = "game-forge-orchestrator"
# OGP 撮影関数（AWS Lambda）の関数名（5.4 / 11.2 / #26）。
#
# **シークレットではないので `[vars]` に置く**（`BUILD_FUNCTION_NAME` /
# `ORCHESTRATOR_FUNCTION_NAME` と同じ扱い）。資格情報のほうは `.dev.vars` にある
# （`BUILD_AWS_*`。オーケストレータを呼ぶのに使っている鍵を、そのまま使う。
# 増やさない理由は src/ogp-client.ts）。
#
# 値の正本は `terraform/ogp-function.tf` の `local.ogp_function_name` である。
# ここはその写しなので、宣言を変えたら追随させること（`docs/ogp-capture.md`）。
#
# **ローカルでも同じ値を置く。** Dev アカウントに Lambda は無いので、ローカルで
# この経路が動くかどうかは `.dev.vars` に本番アカウントの資格情報を入れたかどうかで
# 決まる（`BUILD_FUNCTION_NAME` と同じ事情。確定20）。**入れなければ、公開は成立し、
# 撮影だけが設定不足として起動の手前で止まる**（src/ogp.ts の startOgpCapture）。
OGP_FUNCTION_NAME = "game-forge-ogp"
# アイコンの再エンコード関数（AWS Lambda）の関数名（5.10 / #380）。
#
# **シークレットではないので `[vars]` に置く**（`OGP_FUNCTION_NAME` と同じ扱い）。資格情報は
# `BUILD_AWS_*`（増やさない理由は src/avatar-client.ts）。
#
# 値の正本は `terraform/avatar-function.tf` の `local.avatar_function_name` である。ここはその写しで、
# 3 か所（ここ・production・preview）との一致は scripts/check-avatar-copies.sh が見る。
#
# **ローカルでも同じ値を置く**（Dev アカウントに Lambda は無い。`OGP_FUNCTION_NAME` と同じ事情）。
# **資格情報を入れなければ、アイコンの設定だけが「保存できませんでした」で止まる**
# （src/avatar.ts の convertAvatar が設定不足をログへ残す）。
AVATAR_FUNCTION_NAME = "game-forge-avatar"
CHAT_FUNCTION_NAME = "game-forge-chat"
# 開発用の診断経路（`/__dev/*`）を登録するかどうか（#89）。
#
# **`enabled` はここ（トップレベル＝ローカル）にしか無い。** 配備される 2 つの環境は
# 下で `disabled` を明示する。src/app.ts の `devRoutesEnabled` は値が `enabled` に
# 一致したときだけ有効にするため、宣言し忘れた環境では自動的に閉じる側へ倒れる。
DEV_ROUTES = "enabled"

# ローカル D1。`--local` 実行では database_id は参照されず、Miniflare が
# .wrangler/state 配下の SQLite を使う。本番の ID は D1 を実際に作る時点で入れる
# （それまで実在しない ID を書いておくと、宣言が外部状態を指しているように読める）。
[[d1_databases]]
binding = "DB"
database_name = "game-forge-local"
database_id = "local-only-placeholder"
# マイグレーションの置き場所。`wrangler d1 migrations apply DB --local` がここを読み、
# 適用済みの一覧を D1 側の `d1_migrations` テーブルへ記録する。冪等性はこの台帳が
# 担保するため、SQL 側に `IF NOT EXISTS` を書かない（migrations/0001_init.sql の冒頭）。
migrations_dir = "migrations"

# ローカル R2。同じく `--local` では実際のバケットを参照しない。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "game-forge-local"

# MCP の認可の保存先（#696 / 仕様 5.15）。**`@cloudflare/workers-oauth-provider` が `OAUTH_KV` の名前で必須とする。**
# 載るのはクライアントの登録（DCR）・許可（grant）・トークンの記録で、**トークンはハッシュでだけ**保存される
# （許可の props は暗号化され、鍵はトークンでしか解けない）。ローカルとテストは Miniflare の KV で、id は使われない。
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "local-only-placeholder"

# いいねの正本（5.8 / #339）。**別 Worker `game-forge-likes` の Durable Object を指す。**
#
# **Pages は DO のクラスを自分で持てない**ので、クラスは `workers/likes/` に置き、
# ここは `script_name` で向こうを指すだけである（Pages の宣言では `script_name` が必須）。
# **この binding を読むのは `src/likes.ts` だけ**（窓口を 1 つにする。5.8）。
#
# **トップレベル（ローカル）にも宣言する。** 省くとローカルとテストで本番の結線を
# 再現できない。テストはクラスを同じ実行体へ読み込み、`vitest.config.ts` で自分自身を
# 指すように差し替える（Miniflare は別スクリプトの TypeScript をそのまま動かせない）。
# ローカルで `wrangler pages dev` を使うときは `docs/likes.md` の手順で likes Worker を
# 別に立てる。
[[durable_objects.bindings]]
name = "LIKE_HUB"
class_name = "LikeHub"
script_name = "game-forge-likes"

# プレイ数の正本（2.3.5 / #377）。**いいねと同じ Worker `game-forge-likes` の別クラス `PlayHub`
# を指す**（仕様 3.6 の「いいねと同じ Durable Objects」は「同じ Worker に載せる」と読む）。
# **この binding を読むのは `src/plays.ts` だけ**（`scripts/check-likes-worker.sh` が見る）。
# 宣言を置く場所と理由は `LIKE_HUB` と同じである（トップレベル・production・preview の 3 か所）。
[[durable_objects.bindings]]
name = "PLAY_HUB"
class_name = "PlayHub"
script_name = "game-forge-likes"

# 機械が読める口の呼び出しの上限（#699 / 仕様 5.13）。**いいねと同じ Worker `game-forge-likes` の
# 名前付きの RPC の入口 `ApiRateLimiter` を指す。**
#
# **Pages は Rate Limiting のバインディングを持てない**（`src/likes.ts`）ので、数えるのは向こうの
# Worker である。**この binding を読むのは `src/api-rate-limit.ts` だけ**（`scripts/check-likes-worker.sh`
# が見る）。**呼べなかったときは通す**（fail-open。理由は同ファイルと仕様 5.13）。
#
# **services も環境へ引き継がれない種類の設定である**ので、トップレベル・production・preview の
# 3 か所に置く（`LIKE_HUB` と同じ）。テストでは `vitest.config.ts` が自分自身の入口へ差し替える。
[[services]]
binding = "API_RATE_LIMITER"
service = "game-forge-likes"
entrypoint = "ApiRateLimiter"

# ──────────────────────────────────────────────────────────────────────────────
# 配備される環境（#89）。
#
# Pages が受け付ける名前付き環境は `preview` と `production` の 2 つだけで、
# `wrangler pages deploy` は**配備先ブランチが production_branch と一致するか**で
# どちらを読むかを決める（wrangler 4.121 の実装で確認）。
#
# **vars / d1_databases / r2_buckets は環境へ引き継がれない種類の設定である。**
# 省くとトップレベル（＝ローカル向けの値）が使われてしまうため、両方の環境で
# 明示する。とくに `DEV_ROUTES` を書き忘れると、診断経路が本番で開いたままになる。
# ──────────────────────────────────────────────────────────────────────────────

[env.production.vars]
# **アプリ用ホストが `app.` 付きなのは DNS の制約による**（#89 / 確定16 の改訂）。
#
# `game-forge.ojos.jp` は確定17 で Route53 へ委譲した**ホストゾーンの apex** であり、
# Route53 は apex に CNAME を作れない（ALIAS は AWS のリソースしか指せず
# `*.pages.dev` を指せない）。Cloudflare Pages 側も、外部 DNS のままの apex は
# 対象外としている（ドメインごと Cloudflare のゾーンにすることを要求する）。
# `app.` を 1 ラベル足すと、どちらの制約にも触れずに CNAME 1 本で張れる。
APP_HOST = "app.game-forge.ojos.jp"
SANDBOX_HOST = "sandbox.game-forge.ojos.jp"
# 運営の管理画面（2.4.1 / #356）。**`app.` と兄弟に置く。**
#
# `game-forge.ojos.jp` はゾーンの apex で CNAME を張れないため（上の `APP_HOST` の注記）、
# ここも 1 ラベル足した形になる。**カスタムドメインの登録（Cloudflare API）と Route53 の
# CNAME の両方が要る**——片方だけでは `active` にならない（`docs/admin-host.md`）。
ADMIN_HOST = "admin.game-forge.ojos.jp"
# **#25 の A/B は終わった**（2026-09-02。n=6 では high と medium の差を識別できなかった。
# 仕様書 4.2 の「A/B の結果」）。**採用値は変えないので、素の sonnet-4-6 へ戻す。**
# 登録簿の 2 群（sonnet-4-6-high / -medium）は残してある——n を増やして測り直すときの口である。
GENERATION_MODEL = "sonnet-4-6"
BUILD_FUNCTION_NAME = "game-forge-build"
ORCHESTRATOR_FUNCTION_NAME = "game-forge-orchestrator"
OGP_FUNCTION_NAME = "game-forge-ogp"
AVATAR_FUNCTION_NAME = "game-forge-avatar"
CHAT_FUNCTION_NAME = "game-forge-chat"
DEV_ROUTES = "disabled"

[env.preview.vars]
# プレビュー配備（production_branch 以外のブランチ）。**`*.pages.dev` で公開される**
# ため、開発用の診断経路をここで開けない。ホスト名は本番と同じ値を置く
# （プレビューに専用のカスタムドメインは張らない）。
APP_HOST = "app.game-forge.ojos.jp"
SANDBOX_HOST = "sandbox.game-forge.ojos.jp"
# **プレビューにも本番と同じ値を置く**（`APP_HOST` と同じ理由）。プレビューは
# `*.pages.dev` で公開され、このホスト名では到達できないため、`src/index.ts` のホスト検査で
# admin の全経路が 404 になる。**それが狙いである**——プレビュー配備から管理画面へ
# 入れる経路を作らない。
ADMIN_HOST = "admin.game-forge.ojos.jp"
GENERATION_MODEL = "sonnet-4-6"
BUILD_FUNCTION_NAME = "game-forge-build"
ORCHESTRATOR_FUNCTION_NAME = "game-forge-orchestrator"
OGP_FUNCTION_NAME = "game-forge-ogp"
AVATAR_FUNCTION_NAME = "game-forge-avatar"
CHAT_FUNCTION_NAME = "game-forge-chat"
DEV_ROUTES = "disabled"

# 本番の D1。**ローカル用とは別のデータベース**である（9.1 / 確定20: クラウド環境は
# 本番のみ）。`database_id` は `wrangler d1 create game-forge` が 2026-08-26 に返した
# 実在の ID で、リージョンは APAC。
[[env.production.d1_databases]]
binding = "DB"
database_name = "game-forge"
database_id = "d81a6f80-7d08-4908-b311-2418bacda050"
migrations_dir = "migrations"

# 本番の R2。
[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "game-forge"

# MCP の認可の保存先（#696）。namespace は `game-forge-oauth`（利用者が 2026-09-19 に作った）。
# 本番とプレビューは同じ namespace を指す（D1 / R2 と同じ扱い）。
[[env.production.kv_namespaces]]
binding = "OAUTH_KV"
id = "acafa61986f74b19ad041bbfac9f788b"

# プレビューにも同じバインディングを宣言する。**省くとバインディング自体が消える**
# （トップレベルは名前付き環境へ引き継がれない。`wrangler types` が `DB?: D1Database` と
# 省略可能に変わることで確認できる）。プレビュー専用のデータベースは作らない。
# 9.1 が「クラウド環境は本番のみ」と定めており、preview はカスタムドメインを持たず
# `src/index.ts` のホスト検査で全経路が 404 になるため、実際には触れられない。
[[env.preview.d1_databases]]
binding = "DB"
database_name = "game-forge"
database_id = "d81a6f80-7d08-4908-b311-2418bacda050"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "BUCKET"
bucket_name = "game-forge"

# MCP の認可の保存先（#696）。namespace は `game-forge-oauth`（利用者が 2026-09-19 に作った）。
# 本番とプレビューは同じ namespace を指す（D1 / R2 と同じ扱い）。
[[env.preview.kv_namespaces]]
binding = "OAUTH_KV"
id = "acafa61986f74b19ad041bbfac9f788b"

# いいねの DO（5.8 / #339）。**durable_objects も環境へ引き継がれない種類の設定である**
# （Pages の non-inheritable keys）。省くと本番からバインディングが消え、いいねの口が
# 設定不足で落ちる。preview も同じ理由で宣言する（D1 と同じく本番の実体を指す）。
#
# **`game-forge-likes` を先に配ること。** 存在しないスクリプトを指したまま Pages を
# 配ると、binding が解決できない（配備の順序は `.github/workflows/verify.yml` の
# deploy ジョブが機構で持つ）。
[[env.production.durable_objects.bindings]]
name = "LIKE_HUB"
class_name = "LikeHub"
script_name = "game-forge-likes"

[[env.production.durable_objects.bindings]]
name = "PLAY_HUB"
class_name = "PlayHub"
script_name = "game-forge-likes"

[[env.preview.durable_objects.bindings]]
name = "LIKE_HUB"
class_name = "LikeHub"
script_name = "game-forge-likes"

[[env.preview.durable_objects.bindings]]
name = "PLAY_HUB"
class_name = "PlayHub"
script_name = "game-forge-likes"

# 機械が読める口の上限の入口（#699）。**トップレベルの注記を参照。** 環境へ引き継がれないので両方に置く。
# 配る順序は `LIKE_HUB` と同じ（`game-forge-likes` を先に配る。`.github/workflows/verify.yml`）。
[[env.production.services]]
binding = "API_RATE_LIMITER"
service = "game-forge-likes"
entrypoint = "ApiRateLimiter"

[[env.preview.services]]
binding = "API_RATE_LIMITER"
service = "game-forge-likes"
entrypoint = "ApiRateLimiter"
