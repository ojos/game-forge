services:
  app:
    # vscode の UID/GID をビルド引数で可変にする（#802）。
    #
    # **既定は 1000 のまま**（ベースイメージの vscode と同じ。Mac の Docker Desktop はこれで動く）。
    # dev01（ネイティブ Linux の Docker Engine。利用者は uid=1001）では、bind mount の所有者が
    # 数値のまま通るので、`.devcontainer/.env`（追跡外）に DEVCONTAINER_UID / DEVCONTAINER_GID を
    # 書いて 1001 を渡す。手順は docs/local-dev.md の「dev01 に副開発環境を立てる」。
    #
    # **devcontainer.json の updateRemoteUserUID はこの構成（dockerComposeFile 方式）には効かない**
    # ので、付け替えはイメージのビルドで行う（.devcontainer/Dockerfile と remap-vscode-user.sh）。
    #
    # **image: を併記しない。** build と image を両方書くと、ビルド結果がベースイメージの
    # タグ（mcr.microsoft.com/devcontainers/base:noble）を上書きする。
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${DEVCONTAINER_UID:-1000}
        USER_GID: ${DEVCONTAINER_GID:-1000}
    environment:
      # コンテナのホストが何かを宣言する（#802）。dev01 では `.devcontainer/.env` に
      # DEVCONTAINER_HOST=dev01 を書く。scripts/install-cloudflared.sh はこの値が dev01 のとき、
      # dev01 自身への ssh の入口（自己参照）を書かずに抜ける。Mac では空のまま。
      DEVCONTAINER_HOST: ${DEVCONTAINER_HOST:-}
    # codex の `--sandbox read-only`（同梱の bwrap）を dev01 で動かす（#874）。
    #
    # dev01（Ubuntu 26.04 のネイティブ Docker）はコンテナに AppArmor の `docker-default` を当て、
    # その `deny mount` で bwrap が `Failed to make / slave: Permission denied` になる。すると codex は
    # 差分を読めないまま答える（#873 でゲートは止まるようになったが、第二意見そのものが取れない）。
    # userns の sysctl（apparmor_restrict_unprivileged_userns）は原因ではない——userns の中で
    # ケイパビリティは揃っていた。seccomp は features がすでに unconfined にしており、docker.sock も
    # mount しているので、**外して失う隔離は小さい**。Mac（Docker Desktop）には AppArmor が無いので
    # 何も変わらない。**codex を danger-full-access で回す代わりにこれを選んだ**（read-only の担保を残す）。
    security_opt:
      - apparmor=unconfined
    volumes:
      - ..:/workspaces/game-forge:cached
      # docker-outside-of-docker feature 用（compose 利用時は feature 側の mounts が適用されないため明示）
      - /var/run/docker.sock:/var/run/docker-host.sock
      - gh-storage:/home/vscode/.config/gh
      - aws-storage:/home/vscode/.aws
      - gcloud-storage:/home/vscode/.config/gcloud
      - claude-storage:/home/vscode/.claude
      - gemini-storage:/home/vscode/.gemini
      - codex-storage:/home/vscode/.codex
    command: sleep infinity
volumes:
  gh-storage:
  aws-storage:
  gcloud-storage:
  claude-storage:
  gemini-storage:
  codex-storage:
