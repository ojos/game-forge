name: verify

# 受け入れ検証（scripts/verify.sh）を CI で回すゲート。
#
# verify.sh / loop-gate.sh は手元で走らせる前提の実行体で、回し忘れても何も
# 起きない。ローカル事前ゲートを通していない PR は、受け入れ条件を満たさないまま
# レビューへ届く。ゲートを整備しても実行を忘れられるなら、守られている外観だけが
# 残る。ここが担うのは判定ではなく「実行されること」の側である。
#
# 判定ロジックはこのファイルへ書き写さない。scripts/verify.sh を呼ぶだけにして、
# 手元と CI が同じコードで判定するようにする。書き写すと、手元で緑・CI で赤に
# なったときにどちらが正しいのかを決められなくなる。
#
# 2 系統を張る:
#   - pull_request: マージ前に落とす（通常経路）
#   - push(main):   PR を経由しない直接 push と、マージ後の統合状態を検査する。
#                   並列に進む PR は互いの変更を見ないまま緑になるため、統合して
#                   初めて壊れる組み合わせがある。こちらを省略しない。

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR への連続 push で古い実行を積み残さない。
#
# main では取り消さない。push(main) が見ているのはマージ後の統合状態そのもので、
# 続く push で前の実行を消すと「どのコミットから壊れたか」を追えなくなる。
# pull_request では最新の head だけが関心の対象なので取り消す。
#
# 取り消さないことと直列化しないことは別の要求である。push 側のグループ鍵に
# github.ref を使うと、main への push はどのコミットでも同じ ref
# （refs/heads/main）になるため、cancel-in-progress: false と組み合わさって
# 「取り消されない代わりに同じグループで直列にキュー待ちする」状態になる。
# 連続してマージしたときに後続の実行が待たされ、統合状態を素早く追うという
# 目的に反する。github.sha を使い、push はコミットごとに別グループへ分ける
# ことで、取り消しも待ちも起きないようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # fork からの PR の扱い: この雛形はスキップしない。
    #
    # scripts/verify.sh 自体は Secrets を必要とせず、permissions: contents: read で
    # 足りる。これは fork からの PR に既に与えられている権限であり、走らせられない
    # 理由が無い。スキップすれば、最も検証が要る外部からの変更にだけゲートが
    # 掛からなくなる。スキップの根拠は「その権限では実行できない」ことに限り、
    # 「赤くなりうるから」では外さない。
    #
    # ただし fork からの PR には Secrets もリポジトリ変数（vars）も渡らない。
    # scripts/acceptance.sh へ vars / Secrets に依存する検査を足すと、その検査は
    # fork からの PR でだけ供給元を失う。fail-closed な検査であれば常に赤くなり、
    # 赤が定常状態のゲートは誰も見なくなる。足す側で次のどちらかを選ぶこと。
    #   - 供給元を要する検査を acceptance.sh へ入れず、それ専用のワークフローに
    #     置く（例: 許可 author email を要するコミット identity の検査）。
    #   - fork からの PR を受け付けないリポジトリなら、次の 1 行を有効にする。
    #
    # 条件は fork の真偽で書く。よく使われる
    # `head.repo.full_name == github.repository` の形は、push では
    # github.event.pull_request が無く左辺が空になるため、push(main) の系統まで
    # 丸ごとスキップされる（あちらの形が成り立つのは pull_request だけを契機に
    # 持つワークフロー）。
    # if: github.event.pull_request.head.repo.fork != true

    steps:
      - uses: actions/checkout@v4
        with:
          # 全履歴・全 ref を取る。
          #
          # 既定（fetch-depth: 1）は対象の ref 1 本を深さ 1 で取るだけで、既定
          # ブランチの追跡枝（origin/main）が作られない。ここで起きるのは「範囲が
          # 解決できずに落ちる」ことではなく、範囲を HEAD の全履歴へ落としたうえで、
          # その全履歴が 1 コミットしか無い状態で通過することである。落ちるなら
          # 気づけるが、これは偽の緑になる。
          #
          # 実測（許可外 author を 1 件含む 2 コミットの PR に対する identity 検証）:
          #   深さ 1 -> 検査対象 1 件 / exit 0 で通過
          #   全履歴 -> 検査対象 2 件 / exit 1 で検出
          #
          # acceptance.sh へ履歴を見る検査を足した時点でこの差が効くため、雛形の
          # 側で全履歴を取っておく。
          fetch-depth: 0

      # ── プロジェクトの前提はここへ足す ──────────────────────────────────────
      #
      # 言語ランタイムの用意・ツール（静的解析器など）の導入・依存のインストールは
      # この雛形が持たない。何が必要かは scripts/acceptance.sh が何を検査するかに
      # 従属し、プロジェクトごとに違う。雛形が中途半端に決め打つと、使わない手順を
      # 毎回消す作業をさせることになる。
      #
      # scripts/acceptance.sh は package.json があるとき npm test（vitest）と
      # npm run typecheck（tsc）を実行し、wrangler.toml があるとき
      # scripts/check-worker-types.sh（npx wrangler types）を実行する。
      # いずれも node_modules を要するため、ランナー側で用意する。
      #
      # 版は package.json の engines（>=22）に合わせ、手元の devcontainer と同じ
      # 24 系を使う。手元と CI で版が割れると、片方でだけ再現する不具合が出る。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # npm ci は package.json の prepare を走らせ、worker-configuration.d.ts を
      # 生成する。この生成物は追跡していない（共通規範「再生成できる大容量の
      # 生成物はコミットしない」）ため、これが無いと型検査が成立しない。
      - run: npm ci

      # scripts/acceptance.sh が terraform/ に対して fmt -check を実行する。
      # ツールが無い場合、acceptance.sh は「スキップ」ではなく失敗させる規約なので、
      # ランナー側へ terraform を用意する。
      #
      # terraform_wrapper は無効にする。有効だと terraform がラッパスクリプトへ
      # 置き換わり、fmt -check の終了コードが素通りしない構成がある。合否は
      # terraform 自身の終了コードで判定したい。
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Verify acceptance
        env:
          # CI には .env が無いため、リポジトリ変数がここでの唯一の供給元になる。
          # acceptance.sh が許可 author email を要する検査を持つ構成のために渡す。
          # 要らない構成では空のまま渡り、何も起きない。
          #   利用側リポジトリの Settings > Secrets and variables > Actions >
          #   Variables に ALLOWED_AUTHOR_EMAILS を作成する
          #   （複数はカンマまたは空白区切り。例: "you@example.com"）。
          ALLOWED_AUTHOR_EMAILS: ${{ vars.ALLOWED_AUTHOR_EMAILS }}
        run: bash scripts/verify.sh

      # ── 集計の自己検査（#226）────────────────────────────────────────────
      #
      # scripts/report-selftest.sh は、運用のための集計（#149 の費用・#166 のビルド
      # 時間）が「同じ数え方・同じ日の境界」で動くことを、既知の入力に対して確かめる。
      # **これまで verify.sh にも CI にも入っておらず、誰も回さなければ何も起きな
      # かった。** #211 で 12 件の検査が増えたときに、それが表面化した。
      #
      # **なぜ scripts/acceptance.sh（ローカル層）ではなく、ここなのか。**
      # 実測で report-selftest.sh は 17 秒、acceptance.sh は 20 秒である。ローカル層へ
      # 入れると事前ゲートが 20 → 37 秒（+85%）になる。**この検査が守っているのは
      # 「集計の読み方」であって、反復のたびに壊れる層ではない**——src/ を触っても
      # 壊れず、壊れるのは usage-report.sh / build-time-report.sh / report-window.sh /
      # src/quota.ts の境界を動かしたときだけである。17 秒を毎回払う価値は薄い。
      #
      # **代わりに「ローカルで緑・CI で赤」が起こりうる。** それは受け入れる
      # （docs/handoff.md 4 章「PR を出したら gh pr checks を見る」）。
      #
      # **verify ジョブの段なので、これが赤いと deploy も起きない**（deploy は
      # needs: verify）。集計を読み違える状態で本番を進めないという意味では筋が
      # 通るが、影響は verify.sh の失敗と同じ広さになる。別ジョブにすればそこは
      # 切れるが、checkout と npm ci をもう一度払うことになるため採らない。
      #
      # AWS にも本番 D1 にも触れない（--remote を渡さず、CloudWatch は --events-file
      # で置き換える）。Secrets も vars も要らないので、fork からの PR でも走る。
      - name: Report selftest
        run: bash scripts/report-selftest.sh

  # ── 本番への配備（#95）──────────────────────────────────────────────────────
  #
  # **なぜ別ファイル（workflow_run）ではなく、このワークフローのジョブなのか。**
  #
  # #95 の制約は「verify の後にだけ配備する。ゲートの外側に配備経路を作らない」で
  # ある。**条件式で塞ぐか、依存関係で塞ぐかの違い**がここで効く。
  #
  #   workflow_run 案: verify の完了を契機に別ワークフローを起こし、
  #     `github.event.workflow_run.conclusion == 'success'` を if で見る。
  #     - 配備の可否が**書き忘れうる条件式**になる。条件を落としても、走った側は
  #       緑に見える。ゲートの外側に経路がある状態を、条件式で塞いでいるだけである。
  #     - workflow_run は **pull_request 由来の verify の成功でも発火する。** 絞り
  #       損ねると PR の頭のコミットが本番へ出る。しかも workflow_run のジョブには
  #       **fork 由来の実行に対しても Secrets が渡る**ため、事故の射程が最大になる。
  #     - checkout する ref を明示しないと既定ブランチの先端を取る。**verify が
  #       通ったコミットと、配備するコミットが別物になりうる。**
  #
  #   ここ（needs: verify）: 同じ実行・同じイベント・同じコミットの中で、
  #     verify の後段に置く。
  #     - `needs` は Actions 自身が強制する依存関係で、if のように書き忘れても
  #       「素通り」にならない（書き忘れれば依存が消えるのではなく、ジョブの定義が
  #       変わったことが diff に出る）。**verify が赤なら deploy は起動しない。**
  #     - 契機が push(main) のみなので、fork からの PR は構造的に届かない。
  #     - 配備するコミットは、verify を通したコミットそのものである。
  #
  # **verify.yml が配備も持つことになる。** 冒頭の設計コメントが言う「ここが担うのは
  # 判定ではなく実行されること」の外側へ 1 歩出る。それでもこちらを採るのは、上の
  # とおり「ゲートの外側に配備経路を作らない」を**機構で**保証できるのがこの形だけ
  # だからである。判定ロジックを書き写さない原則（scripts/verify.sh を呼ぶだけ）は
  # 変えていない。
  #
  # **このジョブは Pages のシークレット（SESSION_SECRET 等）を触らない**（#95 の制約）。
  # `wrangler pages deploy` は既存のシークレットを上書きしない。`pages secret put` を
  # ここへ書かないこと。値の投入は docs/pages-deploy.md の手順（人手）が持つ。
  deploy:
    # **配備の可否はこの 1 行が持つ。** verify が失敗・キャンセルされた実行では
    # このジョブは起動しない。
    needs: verify

    # push(main) だけ。pull_request の実行では skip される（この if が false になる）。
    #
    # リポジトリの限定は fork 対策である。fork の main へ push すると、あちらには
    # Secrets が無いので配備は必ず失敗する。verify.yml 冒頭の基準
    # 「スキップの根拠は『その権限では実行できない』ことに限る」に、これは当たる。
    #
    # **ここだけはリポジトリ名を書き写している。** ワークフローから terraform の
    # output（repository_full_name）は読めず、github コンテキストにも「upstream か
    # どうか」を表す値が無いためである。名前を変えたときはここも変える。
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ojos/game-forge'

    runs-on: ubuntu-latest

    # **OIDC のトークンを発行するために要る**（#241）。下の「オーケストレータが古くないか」
    # が AWS を読むために、GitHub Actions のフェデレーションで役を引き受ける。
    # **鍵は置かない**（terraform の aws_iam_role.orchestrator_freshness。読み取り専用）。
    permissions:
      contents: read
      id-token: write

    # **配備は直列にする。鍵を github.sha にしない。**
    #
    # verify 側の鍵（push はコミットごとに別グループ）は「取り消しも待ちも起こさない」
    # ことを狙ったもので、検査には正しい。配備では逆に働く。連続してマージすると
    # 2 つの配備が並走し、**先に始まった古いコミットの配備が後に完了して本番が巻き
    # 戻る**ことがある。
    #
    # 固定の鍵にすると、実行中の 1 本が終わるまで後続は待つ。待っているあいだに
    # さらに新しい実行が来ると、GitHub は**待機中の古い方を取り消す**ため、最後に
    # 残るのは常に最新のコミットになる。cancel-in-progress: false は、走り出した
    # 配備を途中で切らないためである（wrangler の途中終了は成果が中途半端になる）。
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # **2 コミットぶん取る。** ここで git に聞くのは HEAD のハッシュと件名のほかに、
      # **直前のコミットとの差分**（下の「登録簿に関わる差分か」。#241）である。
      # **既定（1）だと `git diff HEAD^ HEAD` が「不明なリビジョン」で落ち、配備が
      # 丸ごと止まる。** verify 側の全履歴までは要らない（1 コミットぶんの差分で足りる）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # wrangler は devDependencies に固定されている（package.json）。npx が
      # レジストリから別の版を引かないよう、ここで入れたものを使う。
      # prepare（wrangler types）は Cloudflare の資格情報を要さない。
      - run: npm ci

      # **未設定を skip にしない。** deploy-compiler.yml の VPS 側は「まだ存在しない
      # 相手」なので skip が正しいが、こちらは**すでに本番が動いている**。設定漏れを
      # skip にすると、#95 で起きたこと（マージしても本番が変わらないのに、どのゲートも
      # 緑）をそのまま作り直すことになる。落として気づけるようにする。
      - name: Secrets が揃っているか
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が Secrets に設定されていません。登録手順は docs/pages-deploy.md「GitHub Secrets への登録」にあります。"
            exit 1
          fi

      # ── オーケストレータが古くないか（#241）────────────────────────────────
      #
      # **2026-09-01、本番の生成が 12 分止まった。** wrangler.toml の GENERATION_MODEL を
      # 変えて Worker を配ったところ、**配備済みのオーケストレータがその鍵を知らず**、
      # ペイロードを拒否した。登録簿を足した PR は repo に入っていたが、
      # **オーケストレータは手動配備で、2.5 時間前のコードのままだった。**
      #
      # **検査は既にあった**（scripts/acceptance-remote.sh の check_orchestrator_code）。
      # 欠けていたのは契機である——外部層は「外部状態の宣言を変更したとき」に回す層で、
      # wrangler.toml の変更は terraform の宣言変更ではない。**誰も回そうと思わなかった。**
      # **だから配備の直前という契機へ移す。**
      #
      # **登録簿に関わる差分のときだけ走らせる。** 毎回 AWS を読むと、AWS 側の不調で
      # Worker を配れなくなる——外部の可用性を配備の前提条件へ持ち込まない
      # （.github/project-ai-rules.md「外部層を単一入口へ含めない理由」と同じ線）。
      - name: オーケストレータの束が変わったか
        id: orchestrator-diff
        run: |
          set -euo pipefail
          # **ファイル名の一覧では決めない**（#263）。以前はここが `wrangler.toml` と
          # `src/generation-models.ts` の 2 本を見ていたが、2026-09-02 に #258 が
          # `src/orchestrator/payload.ts` でペイロードの版 3 を足したとき、一覧に無いので
          # **関門は 1 度も起動せず、送り側だけが版 3 を知っている窓が約 25 分開いた**
          # （実害は 0 件。窓の間の生成が 0 行だったという偶然による）。
          #
          # **一覧を広げても同じことが起きる。** 束には `src/orchestrator/**` のほかに
          # `src/bedrock.ts` や `src/generate.ts` が入っており、次に増えた依存を書き忘れた
          # 日に同じ窓がまた開く。**束そのものを 2 回作って比べれば、一覧を維持する場所が
          # 消える**（esbuild は 15ms）。
          # **`if` の条件式へ直に置かない。** 条件式の中では `set -e` が効かないので、
          # スクリプトが `exit 1`（作業ツリーが汚れている・比較元を解決できない・束を
          # 作れない）で落ちても `else` へ落ち、**関門が黙って外れる。** スクリプト自身が
          # 「判定できないことを『変わっていない』に倒さない」と定めている形そのものになる。
          #
          # **`set -e` の細かい挙動に頼らず、明示的に受ける。** 代入で受ければ `set -e` は
          # 効くが、条件式や `&&` の左辺へ移した日に黙って無効化される種類の依存である。
          if ! out="$(bash scripts/orchestrator-bundle-changed.sh)"; then
            echo "::error::束が変わったかを判定できませんでした（判定スクリプトが失敗）。"
            exit 1
          fi
          echo "$out"
          # **どちらの合図も出ていないときは落とす。** 「CHANGED でなければ UNCHANGED」と
          # 読むと、合図の綴りを変えた日に関門が黙って外れる。
          if printf '%s\n' "$out" | grep -q '^ORCHESTRATOR_BUNDLE_CHANGED$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "オーケストレータの束が変わりました。配備の前に新しさを見ます。"
          elif printf '%s\n' "$out" | grep -q '^ORCHESTRATOR_BUNDLE_UNCHANGED$'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "オーケストレータの束は変わっていません。AWS は読みません。"
          else
            echo "::error::束が変わったかを判定できませんでした（合図がありません）。"
            exit 1
          fi

      - name: AWS の読み取り権を得る（OIDC）
        if: steps.orchestrator-diff.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ORCHESTRATOR_FRESHNESS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: オーケストレータが手元の束と一致すること
        if: steps.orchestrator-diff.outputs.changed == 'true'
        env:
          ORCHESTRATOR_FUNCTION_NAME: ${{ vars.ORCHESTRATOR_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          # **名前を決め打ちしない。** 正本は terraform の local.orchestrator_function_name で、
          # ここへ写すと宣言を動かした日にずれる。空なら落とす（別の関数を読んで通らない）。
          name="${ORCHESTRATOR_FUNCTION_NAME}"
          if [[ -z "$name" ]]; then
            echo "::error::ORCHESTRATOR_FUNCTION_NAME が空です（terraform の github_actions_variable が配ります）。"
            exit 1
          fi
          bash scripts/bundle-orchestrator.sh
          local_sha="$(openssl dgst -sha256 -binary dist/orchestrator.zip | base64)"
          remote_sha="$(aws lambda get-function-configuration \
            --function-name "$name" --query 'CodeSha256' --output text)"
          if [[ "$local_sha" != "$remote_sha" ]]; then
            echo "::error::配備済みのオーケストレータが古いままです。Worker を配ると、生成が静かに止まります（#241）。"
            echo "  手元: ${local_sha}"
            echo "  本番: ${remote_sha}"
            echo "  先に bash scripts/deploy-orchestrator.sh を実行してください（docs/orchestrator.md）。"
            exit 1
          fi
          echo "オーケストレータは手元の束と一致しています（${local_sha}）。"

      - name: Deploy to Cloudflare Pages
        env:
          # wrangler がこの 2 つの名前を直接読む（.env と同じ名前・同じ値）。
          # 保管先が 2 か所になる理由は docs/pages-deploy.md に書いてある。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # **式（${{ }}）を run の中へ書かない。** 置換は文字列として行われるため、
        # 値に引用符が混ざるとシェルの構文ごと変わる（review-gate.yml の同じ注記）。
        # コミット件名は人が書くもので引用符を含みうるので、git から取る。
        run: |
          set -euo pipefail

          # **チェックアウト済みの作業ツリーから取る。** github.sha を式で埋めるのでは
          # なく git に聞くことで、「いま配っているファイル」と「記録するハッシュ」が
          # 同じものであることが構造的に担保される。
          commit_hash="$(git rev-parse HEAD)"
          # 件名だけを取る（%s）。本文まで渡すと Cloudflare の一覧で 1 行に潰れて読めない。
          commit_message="$(git log -1 --pretty=format:%s)"

          # **--commit-hash / --commit-message は省かない**（#95）。#95 の調査で
          # 「本番がどのコミットか」を Cloudflare 側から辿れたことが決め手になった。
          # scripts/acceptance-remote.sh の配備ずれ検知も、この値を読んでいる。
          #
          # --branch main を明示する。省くと wrangler が git のブランチ名を推測し、
          # production_branch と一致しなければ preview として配備される
          # （docs/pages-deploy.md）。
          #
          # --project-name は wrangler.toml の name と同じ値である。ここがずれると
          # 別プロジェクトへ配備され、本番は古いままになるが、その状態は
          # acceptance-remote.sh の配備ずれ検知が拾う（あちらは terraform の
          # 宣言側からプロジェクト名を導いている）。
          npx wrangler pages deploy \
            --project-name game-forge \
            --branch main \
            --commit-hash "$commit_hash" \
            --commit-message "$commit_message"
