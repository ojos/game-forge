name: deploy-compiler

# ビルド関数（確定24 / 3.8）のイメージを ECR へ配り、関数を差し替える（9.3 / #103）。
#
# 9.3 は「**ECR へイメージを push し、`aws lambda update-function-code --image-uri` で
# 関数のイメージを更新する。SSH は使わない**」と定める。ここは 2 段に分ける。
#
#   1. build-and-push: イメージを組み立て、**封じ込めの検査を通してから** ECR へ push する。
#   2. deploy:         push したダイジェストで関数を差し替え、載ったことを確認する。
#
# **`needs` で依存させる（条件式ではなく）。** 9.3 が Pages 側に定めた「ゲートの外側に
# 配備経路を作らない」と同じ形である。検査が落ちれば 2 段目は起動しない。
#
# **配るのはダイジェストである。** `latest` タグで更新すると、あとから
# 「どの版が本番の関数に載っているか」を辿れない（9.3 の「配備の対象はイメージの
# ダイジェストである」。Pages 側で `--commit-hash` を必ず渡すのと同じ理由）。
#
# **資格情報を持たない。** AWS へは OIDC で入る（terraform/github-oidc.tf）。
# 長命のアクセスキーを Secrets へ置く形は採らない。
#
# > **v1.11 までの記述（#103 で置き換え）。** ここは ghcr.io へ push し、`deploy` ジョブが
# > さくらの VPS へ SSH してイメージを入れ替える形だった。**VPS の secret が揃わないため
# > SSH の step は一度も実行されていない**（VPS へ届いたことは一度も無い）。確定24 が
# > 実行環境を Lambda に決めたため、配布先ごと置き換えた。

on:
  push:
    branches: [main]
    paths:
      - 'docker/isolated-build/**'
      - 'scripts/check-isolated-build.sh'
      - '.github/workflows/deploy-compiler.yml'
  # 手で回せるようにする。ベースイメージの更新（3.5）など、docker/ を変えずに
  # 配り直したいことがある。
  workflow_dispatch:

permissions:
  contents: read
  # OIDC のトークンを取るために要る。**これが無いと configure-aws-credentials は
  # 認証できない**（`Credentials could not be loaded`）。
  id-token: write

concurrency:
  group: deploy-compiler
  # 途中で止めない。イメージの push と関数の差し替えは中断されると中途半端な状態を残す。
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.guard.outputs.configured }}
      digest: ${{ steps.push.outputs.digest }}
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: 配備先が宣言されているか
        id: guard
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUILD_IMAGE_REPOSITORY: ${{ vars.BUILD_IMAGE_REPOSITORY }}
          BUILD_FUNCTION_NAME: ${{ vars.BUILD_FUNCTION_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        # **3 つすべてを見る。** どれか 1 つでも欠けると、後段は「認証はできたが
        # 対象が空」という読みにくい失敗になる。
        #
        # **未設定は失敗ではなく skip にする。** これらの変数は Terraform が
        # 宣言している（terraform/build-function.tf）ので、空である＝まだ apply して
        # いない、という 1 つの意味しか持たない。落とすと「まだ apply していない」ことが
        # 毎回の赤として現れ、本物の故障が埋もれる。
        #
        # **イメージのビルドと封じ込めの検査は、この guard の外で必ず走る。** 配れない
        # 状態でも、配る現物が壊れていないことは毎回確かめる。
        run: |
          if [[ -z "${AWS_DEPLOY_ROLE_ARN}" || -z "${BUILD_IMAGE_REPOSITORY}" || -z "${BUILD_FUNCTION_NAME}" || -z "${AWS_REGION}" ]]; then
            echo "[deploy-compiler] Actions 変数が未設定のため、配備は skip します。"
            echo "[deploy-compiler] terraform apply が済むと terraform/build-function.tf が 4 つとも設定します。"
            echo "[deploy-compiler] 必要なのは AWS_DEPLOY_ROLE_ARN / BUILD_IMAGE_REPOSITORY / BUILD_FUNCTION_NAME / AWS_REGION です。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ビルドする
        # **`--platform linux/amd64` を明示する。** 関数は x86_64 で宣言して
        # おり（terraform/build-function.tf の architectures）、**イメージと食い違うと
        # 関数は起動しない。** ランナーが amd64 であることに黙って頼らない。
        #
        # > **`--build-arg TARGETARCH=amd64` だけでは足りない（#103 で踏んだ）。**
        # > あれが決めるのは Dockerfile 内の `GOARCH`、つまり**ハンドラのバイナリだけ**で
        # > あって、**ベースイメージ**（`golang:` にピン留めした版。正本は Dockerfile の
        # > `ARG GO_VERSION`）**はホストのアーキテクチャで引かれる。**
        # > aarch64 の開発機で同じコマンドを打つと **arm64 のベースに amd64 のバイナリが
        # > 入った、どちらでも動かないイメージ**が出来上がる。ランナーが amd64 である
        # > 限り結果は正しいので、**この記述は「黙って頼らない」と書きながら実際には
        # > 頼っていた。** `--platform` で外側も固定する。
        #
        # **`--provenance=false --sbom=false` を付ける。** 既定では BuildKit が
        # attestation を足し、push されるのが単一のマニフェストではなく OCI の
        # image index（`application/vnd.oci.image.index.v1+json`）になる。**Lambda は
        # これを受け付けない**（`CreateFunction` が `The image manifest, config or
        # layer media type for the source image ... is not supported.` を返す。#103）。
        # ランナーの docker は既定でこの形にならないが、**そこに黙って頼らない**のは
        # `--platform` と同じ理由である。
        #
        # commit SHA でも tag を打つ。`latest` だけだと、ECR 上のどの版がどの
        # コミットから来たのかを後から特定できない。
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --build-arg TARGETARCH=amd64 \
            -t "isolated-build:${GITHUB_SHA}" \
            docker/isolated-build

      - name: 封じ込めの検査を通す
        # **push の前に検査する。** 7.1 の制約下で実際にビルドが通らないイメージを
        # レジストリへ置かない。
        #
        # IMAGE を渡すのは、検査スクリプトに作り直させないためである。既定では
        # スクリプトが自分でビルドするが、それだと「同じ Dockerfile から作った別の
        # イメージ」を検査することになり、**配る現物が検査を通った保証にならない。**
        env:
          IMAGE: isolated-build:${{ github.sha }}
        run: bash scripts/check-isolated-build.sh

      - name: AWS へ OIDC で入る
        if: steps.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR へログインする
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          registry="${BUILD_IMAGE_REPOSITORY%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${registry}"
        env:
          BUILD_IMAGE_REPOSITORY: ${{ vars.BUILD_IMAGE_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: push してダイジェストを取る
        id: push
        if: steps.guard.outputs.configured == 'true'
        env:
          BUILD_IMAGE_REPOSITORY: ${{ vars.BUILD_IMAGE_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        # **ダイジェストは ECR に問い合わせる。** ローカルの `docker inspect` からも
        # 取れるが、それは「push したつもりの値」であって「レジストリに在る値」では
        # ない。関数へ渡すのはレジストリ側の事実にする。
        #
        # リポジトリ名はレジストリのホスト名を落として作る。**ワークフローへ綴りを
        # 書き写さない**（宣言は terraform/build-function.tf の local.build_repository_name）。
        run: |
          set -euo pipefail
          docker tag "isolated-build:${GITHUB_SHA}" "${BUILD_IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker tag "isolated-build:${GITHUB_SHA}" "${BUILD_IMAGE_REPOSITORY}:latest"
          docker push "${BUILD_IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker push "${BUILD_IMAGE_REPOSITORY}:latest"

          repository="${BUILD_IMAGE_REPOSITORY#*/}"
          digest="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${repository}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' --output text)"

          if [[ -z "${digest}" || "${digest}" == "None" ]]; then
            echo "[deploy-compiler] push したイメージのダイジェストを取得できません。" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${BUILD_IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          echo "[deploy-compiler] pushed ${BUILD_IMAGE_REPOSITORY}@${digest}"

  deploy:
    needs: build-and-push
    if: needs.build-and-push.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: AWS へ OIDC で入る
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 関数のイメージを差し替える
        env:
          BUILD_FUNCTION_NAME: ${{ vars.BUILD_FUNCTION_NAME }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        # **更新は非同期に完了する。** `wait function-updated` を挟まないと、
        # 「配ったが載る前に緑になった」状態を作れる。
        #
        # **載ったことを読み返して確かめる。** 9.3 が Pages 側で「配備されたか」では
        # なく「一致しているか」を見ると定めているのと同じ理由である。自動化で
        # 消えるのは「配り忘れ」だけで、「配備が失敗したまま気づかない」は残る。
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${BUILD_FUNCTION_NAME}" \
            --image-uri "${IMAGE_URI}" \
            --no-cli-pager >/dev/null

          aws lambda wait function-updated --function-name "${BUILD_FUNCTION_NAME}"

          actual="$(aws lambda get-function \
            --function-name "${BUILD_FUNCTION_NAME}" \
            --query 'Code.ImageUri' --output text)"

          if [[ "${actual}" != "${IMAGE_URI}" ]]; then
            echo "[deploy-compiler] 関数に載っているイメージが配ったものと一致しません。" >&2
            echo "[deploy-compiler]   expected=${IMAGE_URI}" >&2
            echo "[deploy-compiler]   actual  =${actual}" >&2
            exit 1
          fi
          echo "[deploy-compiler] ${BUILD_FUNCTION_NAME} is running ${actual}"
