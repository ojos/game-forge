# Cloudflare Pages の構成宣言。
#
# **Workers ではなく Pages である**（確定22 / #71）。ゾーンは確定17 で Route53 へ
# 委譲済みで Cloudflare 上に無く、Workers のカスタムドメインはゾーンが Cloudflare に
# あることを要求するため `game-forge.ojos.jp` に張れない。Pages のカスタムドメインは
# サブドメインなら外部 DNS のまま CNAME 1 本で足りる（docs/pages-deploy.md）。
#
# 本番向けの設定（custom domain / 本物の D1 database_id）は、対応する issue が来た
# 時点で足す。実在しない ID を先に書くと、宣言が外部状態を指しているように読める。
name = "game-forge"
# Pages の出力ディレクトリ。**静的ファイルを置かない。**
#
# Pages は静的ファイルを Functions より先に解決するため、ここに index.html を置くと
# functions/[[path]].ts の `/` が隠れる（実測で確認）。画面はすべて Worker が生成する
# ので、このディレクトリは空のまま（.gitkeep だけ）にしておく。
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# 開発用ホスト名。src/index.ts は Host ヘッダでアプリ側とサンドボックス側を出し分ける。
#
# `*.localtest.me` は公開 DNS が 127.0.0.1 を返すワイルドカードで、hosts ファイルの
# 編集を要しない。`localtest.me` は PSL の public suffix ではないため登録可能ドメイン
# （eTLD+1）は `localtest.me` であり、下の 2 つは **別オリジン・同一サイト**になる。
# これは本番（`game-forge.ojos.jp` と `sandbox.game-forge.ojos.jp` が eTLD+1
# `ojos.jp` の下で同一サイト）と同じ関係で、7.2 の検証に必要な構造を再現する。
[vars]
APP_HOST = "game-forge.localtest.me"
SANDBOX_HOST = "sandbox.game-forge.localtest.me"

# ローカル D1。`--local` 実行では database_id は参照されず、Miniflare が
# .wrangler/state 配下の SQLite を使う。本番の ID は D1 を実際に作る時点で入れる
# （それまで実在しない ID を書いておくと、宣言が外部状態を指しているように読める）。
[[d1_databases]]
binding = "DB"
database_name = "game-forge-local"
database_id = "local-only-placeholder"
# マイグレーションの置き場所。`wrangler d1 migrations apply DB --local` がここを読み、
# 適用済みの一覧を D1 側の `d1_migrations` テーブルへ記録する。冪等性はこの台帳が
# 担保するため、SQL 側に `IF NOT EXISTS` を書かない（migrations/0001_init.sql の冒頭）。
migrations_dir = "migrations"

# ローカル R2。同じく `--local` では実際のバケットを参照しない。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "game-forge-local"
